name: Android 10 APK build

on:
  push:
    branches: [qcar-android10-poweramp-gps]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android10:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Ubuntu GitHub-hosted runners include the Android command-line SDK.
      # setup-android@v3 attempts to install the removed legacy "tools" package.
      - name: Install compile SDK
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"
      - name: Assemble debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: qcardash-android10-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
